name: Windows desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Offline tests, native GUI smoke, self-contained package
        shell: pwsh
        run: .\scripts\Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BrotherNetworkManager-win-x64
          path: |
            artifacts/BrotherNetworkManager-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
